<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiFi Torch Test</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:30px">
  <h2>LiFi Torch Test</h2>
  <button id="btn" style="font-size:22px;padding:18px 36px">Find torch</button>
  <pre id="log" style="text-align:left;font-size:14px;white-space:pre-wrap"></pre>
  <video id="v" playsinline muted style="width:120px"></video>

  <script>
    const log = m => document.getElementById('log').textContent += m + '\n';
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const v = document.getElementById('v');
    let track = null, on = false;

    // Fully release a camera so the next one can open
    async function release(stream) {
      stream.getTracks().forEach(t => t.stop());
      v.srcObject = null;
      await wait(500);
    }

    document.getElementById('btn').onclick = async () => {
      try {
        if (!track) {
          // 1. Ask permission once, so camera names become visible
          const first = await navigator.mediaDevices.getUserMedia({ video: true });
          await release(first);

          // 2. List every camera
          const cams = (await navigator.mediaDevices.enumerateDevices())
                         .filter(d => d.kind === 'videoinput');
          log('Cameras found: ' + cams.length);

          // 3. Try each camera; skip any that fail to open
          for (const cam of cams) {
            const name = cam.label || 'camera';
            let s;
            try {
              s = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: cam.deviceId } }
              });
            } catch (e) {
              log(name + ': could not open (' + e.name + ')');
              continue;                                 // move on to the next camera
            }
            const t = s.getVideoTracks()[0];
            v.srcObject = s;
            await v.play();                              // start the preview
            await wait(800);                             // let the camera start
            const has = !!t.getCapabilities().torch;
            log(name + ': torch ' + (has ? 'YES' : 'no'));
            if (has) { track = t; break; }               // keep this camera
            await release(s);                            // close it before trying the next
          }

          if (!track) { log('No camera with torch control'); return; }
          document.getElementById('btn').textContent = 'Toggle torch';
        }
        // 4. Switch the flash
        on = !on;
        await track.applyConstraints({ advanced: [{ torch: on }] });
        log('Torch ' + (on ? 'ON' : 'OFF'));
      } catch (e) {
        log('Error: ' + e.name + ' – ' + e.message);
      }
    };
  </script>
</body>
</html>
