<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiFi Torch Test</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:30px">
  <h2>LiFi Torch Test</h2>
  <button id="btn" style="font-size:22px;padding:18px 36px">Find torch</button>
  <pre id="log" style="text-align:left;font-size:14px;white-space:pre-wrap"></pre>
  <video id="v" playsinline muted style="width:120px"></video>

  <script>
    const log = m => document.getElementById('log').textContent += m + '\n';
    let track = null, on = false;

    document.getElementById('btn').onclick = async () => {
      try {
        if (!track) {
          // 1. Ask permission once, so the phone reveals camera names
          const first = await navigator.mediaDevices.getUserMedia({ video: true });
          first.getTracks().forEach(t => t.stop());

          // 2. List every camera on the phone
          const cams = (await navigator.mediaDevices.enumerateDevices())
                         .filter(d => d.kind === 'videoinput');
          log('Cameras found: ' + cams.length);

          // 3. Try each camera until one has torch control
          for (const cam of cams) {
            const s = await navigator.mediaDevices.getUserMedia({
              video: { deviceId: { exact: cam.deviceId } }
            });
            const t = s.getVideoTracks()[0];
            const v = document.getElementById('v');
            v.srcObject = s;
            await v.play();                              // start the preview
            await new Promise(r => setTimeout(r, 800));  // let the camera start
            const has = !!t.getCapabilities().torch;
            log((cam.label || 'camera') + ': torch ' + (has ? 'YES' : 'no'));
            if (has) { track = t; break; }               // found it: keep this camera
            t.stop();                                    // otherwise close it, try next
          }

          if (!track) { log('No camera with torch control'); return; }
          document.getElementById('btn').textContent = 'Toggle torch';
        }
        // 4. Switch the flash
        on = !on;
        await track.applyConstraints({ advanced: [{ torch: on }] });
        log('Torch ' + (on ? 'ON' : 'OFF'));
      } catch (e) {
        log('Error: ' + e.name + ' – ' + e.message);
      }
    };
  </script>
</body>
</html>
