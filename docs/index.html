<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiFi Transmitter</title>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:500px;margin:auto">
  <h2 style="text-align:center">LiFi UART Transmitter</h2>

  <button id="connect" style="width:100%;font-size:20px;padding:14px">1. Connect torch</button>
  <p>Message:</p>
  <input id="msg" value="Hello LiFi!" style="width:100%;font-size:20px;padding:8px;box-sizing:border-box">
  <p>Bit time (ms) — must match BIT_MS in the Arduino code:</p>
  <input id="bit" type="number" value="250" style="width:100%;font-size:20px;padding:8px;box-sizing:border-box">
  <br><br>
  <button id="send" style="width:100%;font-size:20px;padding:14px" disabled>2. Send</button>
  <pre id="log" style="white-space:pre-wrap;font-size:14px"></pre>
  <video id="v" playsinline muted style="width:80px"></video>

  <script>
    const log = m => document.getElementById('log').textContent = m;
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const waitUntil = t => wait(Math.max(0, t - performance.now()));
    const v = document.getElementById('v');
    let track = null, torchOn = false;

    // Switch the torch, but only if the state actually changes (fewer calls = less delay)
    async function setTorch(state) {
      if (state === torchOn) return;
      await track.applyConstraints({ advanced: [{ torch: state }] });
      torchOn = state;
    }

    // Find the rear camera that has torch control (same method as the test page)
    document.getElementById('connect').onclick = async () => {
      try {
        const first = await navigator.mediaDevices.getUserMedia({ video: true });
        first.getTracks().forEach(t => t.stop()); await wait(500);
        const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
        for (const cam of cams) {
          let s;
          try { s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: cam.deviceId } } }); }
          catch (e) { continue; }
          const t = s.getVideoTracks()[0];
          v.srcObject = s; await v.play(); await wait(800);
          if (t.getCapabilities().torch) { track = t; break; }
          s.getTracks().forEach(x => x.stop()); v.srcObject = null; await wait(500);
        }
        if (!track) return log('No camera with torch control');
        log('Torch connected: ready to send');
        document.getElementById('send').disabled = false;
      } catch (e) { log('Error: ' + e.name + ' – ' + e.message); }
    };

    document.getElementById('send').onclick = async () => {
      const text = document.getElementById('msg').value;
      const bitMs = Number(document.getElementById('bit').value);
      const btn = document.getElementById('send');
      btn.disabled = true;
      try {
        await setTorch(false);
        await wait(1000);                                   // quiet gap before the message
        for (let i = 0; i < text.length; i++) {
          let code = text.charCodeAt(i);
          if (code < 32 || code > 126) code = 63;           // non-English character → '?'
          const bits = [1];                                 // start bit = torch ON
          for (let k = 0; k < 8; k++) bits.push((code >> k) & 1); // data bits, D0 first
          bits.push(0, 0);                                  // 2 stop bits = torch off

          log('Sending ' + (i + 1) + '/' + text.length + ": '" + String.fromCharCode(code) +
              "' = " + code.toString(2).padStart(8, '0'));

          await setTorch(true);                             // start bit
          const t0 = performance.now();                     // timing reference for this character
          for (let j = 1; j < bits.length; j++) {
            await waitUntil(t0 + j * bitMs);                // exact slot for bit j
            await setTorch(bits[j] === 1);
          }
          await waitUntil(t0 + bits.length * bitMs);        // finish the last stop bit
        }
        await setTorch(false);
        log('Done: sent ' + text.length + ' characters');
      } catch (e) { log('Error: ' + e.name + ' – ' + e.message); }
      btn.disabled = false;
    };
  </script>
</body>
</html>
